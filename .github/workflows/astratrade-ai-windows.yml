name: AstraTrade AI Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'astratrade_gui.py'
      - 'tests/**'
      - '.github/workflows/astratrade-ai-windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m py_compile astratrade_gui.py
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name AstraTradeAI astratrade_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: AstraTradeAI-Windows
          path: dist/AstraTradeAI.exe
          if-no-files-found: error
          retention-days: 30
