name: AstraTrade AI Windows EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name AstraTradeAI astratrade_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: AstraTradeAI-Windows
          path: dist/AstraTradeAI.exe
