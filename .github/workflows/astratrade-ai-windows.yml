name: AstraTrade AI Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'astratrade_gui.py'
      - 'tests/**'
      - '.github/workflows/astratrade-ai-windows.yml'
  pull_request:
    paths:
      - 'astratrade_gui.py'
      - 'tests/**'
      - '.github/workflows/astratrade-ai-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pyinstaller tzdata
      - run: python -m py_compile astratrade_gui.py
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all tzdata --name AstraTradeAI astratrade_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: AstraTradeAI-Windows
          path: dist/AstraTradeAI.exe
          if-no-files-found: error
          retention-days: 30

      - name: Record build metadata
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $status = [ordered]@{
            status = "${{ job.status }}"
            workflow_run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            source_commit = "${{ github.sha }}"
            branch = "${{ github.ref_name }}"
            artifact_name = "AstraTradeAI-Windows"
            recorded_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $status | ConvertTo-Json -Depth 4 | Set-Content -Path build-status.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-status.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record AstraTrade Windows build status"
            git push origin HEAD:${{ github.ref_name }}
          }
